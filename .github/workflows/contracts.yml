name: Edge host contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate all declared Linux systems
        run: nix flake check --all-systems --no-build --no-write-lock-file
      - name: Build and run native checks
        run: nix flake check --print-build-logs --no-write-lock-file
