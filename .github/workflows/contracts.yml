name: Edge host contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install contract test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbcl kotlin
      - name: Test dependency bootstrap integrity
        run: python3 -m unittest discover -s tests -p test_host_lisp_setup.py -v
      - name: Install pinned Sento and transitive Lisp sources
        run: |
          python3 tools/install_host_lisp.py "$RUNNER_TEMP/edge-host-lisp"
          echo "CL_SOURCE_REGISTRY=$RUNNER_TEMP/edge-host-lisp//" >> "$GITHUB_ENV"
      - name: Verify Sento loads without Quicklisp
        run: sbcl --no-sysinit --no-userinit --non-interactive --eval '(require :asdf)' --eval '(asdf:load-system :sento)'
      - name: Target and ownership metadata
        run: python3 tools/check_contracts.py
      - name: Common Lisp forwarding and deny-by-default contract
        run: sbcl --script tests/runtime.lisp
      - name: Private mesh core semantics (synthetic transport only)
        run: sbcl --script tests/mesh.lisp
      - name: Experimental owned-process transport (host C ABI stub, not ECL or ART)
        run: python3 tests/android/test_owned_process.py --build-dir build/owned-host
      - name: Compile and test JVM facades (not Android or device coverage)
        run: |
          mkdir -p build
          kotlinc platforms/android/EdgeHost.kt platforms/watch/WatchHost.kt platforms/glasses/GlassesHosts.kt tests/HostContractTest.kt -include-runtime -d build/host-tests.jar
          java -jar build/host-tests.jar
